name: Actualizador Windows
on:
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/update-windows.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/update-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updater:
    name: Regresión del actualizador (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node tests/ci-command.mjs npm run test:update
      - run: node tests/ci-command.mjs npm test
      - run: node tests/ci-command.mjs npm run build
